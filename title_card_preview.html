<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Card - Setting Up Environment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --neon-blue: #00f2ff;
            --neon-magenta: #ff00e5;
            --neon-yellow: #fff200;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND EFFECTS --- */
        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            animation: grid-move 20s linear infinite;
            z-index: 0;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        .gradient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(162, 0, 255, 0.15) 0%, transparent 70%);
            z-index: 1;
        }

        /* --- TITLE CARD CONTAINER --- */
        .title-card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px;
            border: 4px solid white;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            max-width: 90vw;
            animation: scale-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scale-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- DECORATIVE CORNERS --- */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 6px solid var(--neon-blue);
            z-index: 11;
        }
        .top-left { top: -15px; left: -15px; border-right: none; border-bottom: none; }
        .top-right { top: -15px; right: -15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -15px; left: -15px; border-right: none; border-top: none; }
        .bottom-right { bottom: -15px; right: -15px; border-left: none; border-top: none; }

        /* --- CONTENT --- */
        .clapperboard {
            font-size: 3rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: clap 2s infinite;
        }

        @keyframes clap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            color: white;
            text-shadow: 4px 4px 0px var(--neon-magenta);
            line-height: 1.1;
        }

        .sub-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            color: var(--neon-blue);
            margin-top: 20px;
            letter-spacing: 2px;
            display: block;
            border-right: 3px solid var(--neon-blue);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 2.5s steps(30, end), blink 0.5s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-blue) }
        }

        .badge-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            animation: fade-up 0.5s forwards;
            animation-delay: 2.8s;
        }

        @keyframes fade-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .badge {
            background: var(--neon-magenta);
            color: white;
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--neon-magenta);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge.yellow {
            background: var(--neon-yellow);
            color: black;
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        /* --- SCANLINE EFFECT --- */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, .3) 51%,
                transparent 51%
            );
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.1;
        }

    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="gradient-glow"></div>
    
    <div class="title-card">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="clapperboard">🎬</div>
        <h1 class="main-title">SETTING UP<br>DEVELOPER ENVIRONMENT...</h1>
        <span class="sub-title">INITIALIZING WORKSPACE_</span>

        <div class="badge-container">
            <div class="badge">INSTALLING TOOLS 🔥</div>
            <div class="badge yellow">🛠️ TOOLS YOU NEED</div>
        </div>
    </div>

    <div class="scanline"></div>

    <script>
        // Subtle glitch effect on the main title every few seconds
        const title = document.querySelector('.main-title');
        setInterval(() => {
            title.style.textShadow = `
                ${Math.random() * 10 - 5}px ${Math.random() * 10 - 5}px 0px var(--neon-magenta),
                ${Math.random() * 10 - 5}px ${Math.random() * 10 - 5}px 0px var(--neon-blue)
            `;
            setTimeout(() => {
                title.style.textShadow = '4px 4px 0px var(--neon-magenta)';
            }, 100);
        }, 3000);
    </script>
</body>
</html>
